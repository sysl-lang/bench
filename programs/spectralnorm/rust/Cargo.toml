# The crates the Game's spectralnorm.rust-5 names; the source is used unmodified (SOURCES.md).
[package]
name = "spectralnorm"
version = "0.0.0"
edition = "2015"
autobins = false

[[bin]]
name = "spectralnorm"
path = "spectralnorm.rs"

[dependencies]
rayon = "1"

[profile.release]
opt-level = 3
codegen-units = 1
