# The crates the Game's fasta.rust-7 names; the source is used unmodified (SOURCES.md).
[package]
name = "fasta"
version = "0.0.0"
edition = "2015"
autobins = false

[[bin]]
name = "fasta"
path = "fasta.rs"

[dependencies]
num_cpus = "1"
spin = "0.9"

[profile.release]
opt-level = 3
codegen-units = 1
