# The crates the Game's revcomp.rust names; the source is used unmodified (SOURCES.md).
[package]
name = "revcomp"
version = "0.0.0"
edition = "2015"
autobins = false

[[bin]]
name = "revcomp"
path = "revcomp.rs"

[dependencies]
memchr = "2"
rayon = "1"

[profile.release]
opt-level = 3
codegen-units = 1
