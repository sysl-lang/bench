# The crates the Game's regexredux.rust-7 names; the source is used unmodified (SOURCES.md).
# pcre2-sys finds Homebrew's PCRE2, the library the C program links, through pkg-config.
[package]
name = "regexredux"
version = "0.0.0"
edition = "2015"
autobins = false

[[bin]]
name = "regexredux"
path = "regexredux.rs"

[dependencies]
libc = "0.2"
pcre2-sys = "0.2"
rayon = "1"

[profile.release]
opt-level = 3
codegen-units = 1
