# The crate the Game's pidigits.rust-4 names (rug); the source is used unmodified (SOURCES.md).
# gmp-mpfr-sys is rug's own GMP binding, named here only to link Homebrew's GMP, the library the C
# program links, instead of building a second copy of GMP from source.
[package]
name = "pidigits"
version = "0.0.0"
edition = "2015"
autobins = false

[[bin]]
name = "pidigits"
path = "pidigits.rs"

[dependencies]
rug = { version = "1", default-features = false, features = ["integer"] }
gmp-mpfr-sys = { version = "1", default-features = false, features = ["use-system-libs"] }

[profile.release]
opt-level = 3
codegen-units = 1
